<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="940" height="220" role="img" aria-label="Marce García — Asesora Inmobiliaria, Puerto Vallarta y Riviera Nayarit">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2433"/>
      <stop offset="0.55" stop-color="#123a52"/>
      <stop offset="1" stop-color="#1d5a7a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9ef7"/>
      <stop offset="1" stop-color="#0e6ba8"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57b8ff"/>
      <stop offset="1" stop-color="#2e9ef7"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="940" height="220" fill="url(#sky)"/>

  <!-- sun + glow -->
  <circle cx="800" cy="64" r="64" fill="url(#sunGlow)">
    <animate attributeName="r" values="60;70;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="64" r="24" fill="#ffd97a">
    <animate attributeName="r" values="22;26;22" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- birds -->
  <g stroke="#cfe8ff" stroke-width="2.4" fill="none" stroke-linecap="round">
    <g>
      <path d="M0,0 q5,-6 10,0 q5,-6 10,0"/>
      <animateTransform attributeName="transform" type="translate" from="120 70" to="420 46" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M0,0 q4,-5 8,0 q4,-5 8,0"/>
      <animateTransform attributeName="transform" type="translate" from="180 96" to="480 72" dur="17s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- palm on left, swaying -->
  <g transform="translate(64,150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 0 0; 2.4 0 0; -2 0 0" dur="7s" repeatCount="indefinite"/>
      <path d="M0,0 C4,-18 5,-36 3,-52" stroke="#7a5c3e" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g fill="#1f8a5a">
        <path d="M3,-52 C-14,-62 -28,-60 -38,-52 C-24,-52 -12,-50 3,-46 Z"/>
        <path d="M3,-52 C20,-63 34,-61 44,-52 C30,-52 17,-50 3,-46 Z"/>
        <path d="M3,-52 C-8,-68 -6,-80 0,-88 C4,-78 6,-64 6,-50 Z"/>
        <path d="M3,-52 C14,-66 26,-70 36,-70 C24,-62 12,-54 4,-48 Z"/>
      </g>
    </g>
  </g>

  <!-- little house with glowing windows -->
  <g transform="translate(150,108)">
    <path d="M0,26 L0,6 L22,-12 L44,6 L44,26 Z" fill="#f4ede1"/>
    <path d="M-4,8 L22,-15 L48,8 L42,12 L22,-6 L2,12 Z" fill="#c05a3c"/>
    <rect x="8" y="12" width="9" height="9" fill="#ffd97a">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="27" y="12" width="9" height="9" fill="#ffd97a">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- back wave (slower, leftward) -->
  <g opacity="0.55">
    <path d="M-200,140 Q-150,122 -100,140 T0,140 T100,140 T200,140 T300,140 T400,140 T500,140 T600,140 T700,140 T800,140 T900,140 T1000,140 T1100,140 T1200,140 L1200,220 L-200,220 Z" fill="url(#sea)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- front wave (faster, rightward) -->
  <g>
    <path d="M-400,168 Q-350,150 -300,168 T-200,168 T-100,168 T0,168 T100,168 T200,168 T300,168 T400,168 T500,168 T600,168 T700,168 T800,168 T900,168 T1000,168 T1100,168 T1200,168 T1300,168 T1400,168 L1400,220 L-400,220 Z" fill="url(#sea2)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- foam sparkles -->
    <g fill="#eaf7ff">
      <circle cx="240" cy="164" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="161" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="165" r="2.4"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="162" r="1.9"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- name block -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="470" y="86" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="6">MARCE GARCÍA</text>
    <text x="470" y="112" fill="#9fd6ff" font-size="13.5" letter-spacing="3">ASESORA INMOBILIARIA · PUERTO VALLARTA &amp; RIVIERA NAYARIT</text>
    <text x="470" y="128" fill="#7fb6d9" font-size="10.5" letter-spacing="2">COFUNDADORA DE ANCURIA · CEO MÉXICO @ CREANDO TU MATRIX</text>
  </g>
</svg>
